<h1>A friend shared their wine list</h1>
<p>Their rankings open in the Pour app. If you're not friends yet, you can add them from there.</p>
<div class="card">
  <p><a class="button" id="open" href="#">Open in Pour</a></p>
  <p class="muted">Don't have Pour yet? It's in a small test for people 21 and older: ask your friend for an invite link.</p>
</div>
<p class="muted"><a href="privacy.html">Privacy policy</a></p>
<script>
  var raw = new URLSearchParams(location.search).get('t') || '';
  var token = /^[0-9a-f]{32}$/.test(raw) ? raw : '';
  var open = document.getElementById('open');
  if (token) {
    open.href = 'pour://list/' + token;
  } else {
    open.parentNode.innerHTML = '<span class="muted">This link looks incomplete. Ask your friend to share it again.</span>';
  }
</script>
